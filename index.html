<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess Ladder</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: one narrow column. Who-you-are and your options first, then the full ladder, then recent challenges, then organizer tools. */
:root {
  --bg: #eef1ee;
  --surface: #ffffff;
  --surface2: #e3e9e5;
  --ink: #18221d;
  --muted: #56665d;
  --line: #cdd7d0;
  --accent: #1e6a54;
  --accent-ink: #ffffff;
  --reach: #e2efe9;
  --immune: #24539e;
  --immune-bg: #e0e9f9;
  --bye: #7a4f00;
  --bye-bg: #fbeecb;
  --warn: #a63a2a;
  --font-display: "Space Grotesk", "Inter", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1612; --surface: #17211c; --surface2: #202d26; --ink: #e6eee9; --muted: #9aaba1;
    --line: #2c3a32; --accent: #5cbd98; --accent-ink: #0a1510; --reach: #1b2e26;
    --immune: #8db4f0; --immune-bg: #1b2a45; --bye: #e8c262; --bye-bg: #38300f; --warn: #ee9181;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1612; --surface: #17211c; --surface2: #202d26; --ink: #e6eee9; --muted: #9aaba1;
  --line: #2c3a32; --accent: #5cbd98; --accent-ink: #0a1510; --reach: #1b2e26;
  --immune: #8db4f0; --immune-bg: #1b2a45; --bye: #e8c262; --bye-bg: #38300f; --warn: #ee9181;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 56px;
}
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 30px; line-height: 1.1; }
h2 { font-size: 18px; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }

.masthead { display: flex; flex-direction: column; gap: 10px; }
.board-strip {
  height: 16px; border-radius: 3px; border: 1px solid var(--line);
  background: repeating-conic-gradient(var(--surface2) 0 25%, var(--surface) 0 50%) 0 0 / 32px 32px;
}
.title-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.round-pill { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel > h2 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }

label.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; }
select, input[type="number"], input[type="file"], textarea {
  font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; min-width: 0; max-width: 100%;
}
select { font-weight: 500; }
textarea { min-height: 96px; resize: vertical; width: 100%; }
input[type="number"] { width: 90px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

button {
  font: inherit; font-weight: 600; font-size: 14px; cursor: pointer; border-radius: 6px; padding: 8px 13px;
  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
}
button.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
button.danger { background: transparent; color: var(--warn); border-color: var(--warn); }
button.link { background: none; border: none; padding: 2px 0; color: var(--muted); font-weight: 500; font-size: 13px; text-decoration: underline; }
button[disabled] { opacity: 0.45; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.me-head { display: flex; align-items: center; gap: 14px; min-width: 0; }
.bigrank { font-family: var(--font-display); font-weight: 700; font-size: 40px; line-height: 1; color: var(--accent); min-width: 2ch; }
.me-name { font-family: var(--font-display); font-size: 20px; font-weight: 700; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.chip { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--surface2); color: var(--muted); white-space: nowrap; }
.chip.immune { background: var(--immune-bg); color: var(--immune); }
.chip.bye { background: var(--bye-bg); color: var(--bye); }
.chip.you { background: var(--accent); color: var(--accent-ink); }
.actions { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding-top: 14px; }
.action { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; justify-content: space-between; }
.action .what { flex: 1 1 220px; min-width: 0; }
.action .what b { display: block; }
.confirm-note { background: var(--surface2); border-radius: 6px; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.confirm-note span { flex: 1 1 200px; }

.ladder { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.ladder li { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); }
.ladder li:first-child { border-top: none; }
.ladder li.reach { background: var(--reach); }
.ladder li.me { box-shadow: inset 4px 0 0 var(--accent); }
.ladder .rk { font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--muted); }
.ladder .nm { min-width: 0; overflow-wrap: anywhere; }
.ladder .nm .chips { margin-top: 3px; }
.ladder .act { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; align-items: center; }
details { font-size: 13px; color: var(--muted); }
details summary { cursor: pointer; font-weight: 600; color: var(--ink); }
.rules-list { margin: 8px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.ladder .why { font-size: 12px; color: var(--muted); }
.delta { display: block; font-family: var(--font-body); font-size: 12px; font-weight: 600; line-height: 1.3; color: var(--muted); }
.delta.up { color: var(--accent); }
.delta.down { color: var(--warn); }
.delta.new { color: var(--immune); }
.prefsel { font-size: 13px; padding: 6px 8px; }
.osec { font-size: 15px; color: var(--ink); border-top: 1px solid var(--line); padding-top: 12px; }
.osec > summary { font-family: var(--font-display); font-weight: 700; font-size: 17px; cursor: pointer; color: var(--ink); }
.osec > .otitle { font-family: var(--font-display); font-weight: 700; font-size: 17px; color: var(--ink); }
.obody { display: flex; flex-direction: column; gap: 14px; padding-top: 12px; }
.acct { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; font-size: 13px; }
.urlin { flex: 1 1 100%; font: inherit; font-size: 13px; padding: 6px 8px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; min-width: 0; }
.ladder .confirm-row { grid-column: 2 / -1; }
.ladder button { padding: 6px 11px; font-size: 13px; }

.feed { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.feed li { display: flex; flex-wrap: wrap; gap: 6px 12px; justify-content: space-between; align-items: center; }
.feed .vs { min-width: 0; overflow-wrap: anywhere; }
.feed .meta { font-size: 12px; color: var(--muted); }

.empty { text-align: left; display: flex; flex-direction: column; gap: 8px; }
.preview { background: var(--surface2); border-radius: 6px; padding: 10px 12px; font-size: 13px; display: flex; flex-direction: column; gap: 6px; }
.warn-text { color: var(--warn); }
.rules { font-size: 13px; color: var(--muted); }

#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: min(92vw, 520px); background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 8px; font-size: 14px; z-index: 20; }
#toast[hidden] { display: none; }
#toast.err { background: var(--warn); color: var(--surface); }
@media (prefers-reduced-motion: no-preference) { button { transition: opacity 0.15s; } }
</style>

</head>
<body>
<div class="wrap" id="app"></div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
(function () {
  "use strict";

  /* ---------- tiny DOM helper ---------- */
  function h(tag, props) {
    var e = document.createElement(tag);
    props = props || {};
    Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (v == null || v === false) return;
      if (k === "class") e.className = v;
      else if (k === "text") e.textContent = v;
      else if (k.indexOf("on") === 0) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? "" : v);
    });
    for (var i = 2; i < arguments.length; i++) {
      var kids = [].concat(arguments[i]);
      for (var j = 0; j < kids.length; j++) {
        var c = kids[j];
        if (c == null || c === false) continue;
        e.append(c && c.nodeType ? c : document.createTextNode(String(c)));
      }
    }
    return e;
  }

  /* ---------- state ---------- */
  var CFG = window.CHESS_LADDER_CONFIG || {};
  var SHEET = { id: "", range: "", label: "your Google Sheet" };
  var db = null, auth = null, downloads = null, mcp = null, me = null;
  var admins = [], isOwner = false, adminUnsub = null, adminDraft = "", sheetDraft = null;
  var ladder = null, challenges = [], moves = [], pairingsDocs = [], proposal = null;
  var openSections = new Set(["round", "byes", "pairings"]);
  var openRounds = new Set(), importProgress = "", manual = { round: "", text: "" }, manualOpen = false;
  var ready = { ladder: false };
  var slow = false, dbMissing = false, loadError = null;
  var isAdmin = false, canWrite = false;
  var meId = null;
  var confirmKey = null;
  var busy = false;
  var editing = false, dirty = false;
  var pasteText = "";
  var pendingImport = null, importError = "";
  var settingsDraft = null;
  var toastTimer = null;
  var appEl = document.getElementById("app");

  try { meId = localStorage.getItem("chess-ladder-me"); } catch (e) {}

  /* ---------- derived values ---------- */
  function players() { return (ladder && ladder.players) || []; }
  function round() { return (ladder && ladder.round) || 1; }
  function maxJump() { return ladder && ladder.maxJump != null ? ladder.maxJump : 5; }
  function indexOf(id) { return players().findIndex(function (p) { return p.id === id; }); }

  function derive() {
    var importedAt = (ladder && ladder.importedAt) || 0;
    var d = { revoked: new Set(), byeNow: new Map(), byeCount: new Map(), busy: new Set(), pending: [], done: [] };
    moves.forEach(function (m) {
      if (m.type === "revoke" && (m.at || 0) >= importedAt) d.revoked.add(m.playerId);
      if (m.type === "bye") {
        d.byeCount.set(m.playerId, (d.byeCount.get(m.playerId) || 0) + 1);
        if (m.round === round()) d.byeNow.set(m.playerId, m.id);
      }
    });
    challenges.forEach(function (c) {
      if (c.status === "pending") { d.busy.add(c.challengerId); d.busy.add(c.targetId); d.pending.push(c); }
      else d.done.push(c);
    });
    d.pending.sort(function (a, b) { return (a.at || 0) - (b.at || 0); });
    d.done.sort(function (a, b) { return (b.resolvedAt || b.at || 0) - (a.resolvedAt || a.at || 0); });
    return d;
  }
  function isImmune(p, d) { return !!p.immune && !d.revoked.has(p.id); }

  /* ladder at the start of the previous round, for rank change and "new" players */
  function prevStart() {
    var doc = pairingsDocs.find(function (x) { return x.round === round() - 1; });
    return doc && doc.start && Object.keys(doc.start).length ? doc.start : null;
  }
  function isNewPlayer(id) { var s = prevStart(); return !!s && s[id] == null; }
  function currentStart() { var o = {}; players().forEach(function (p, i) { o[p.id] = i + 1; }); return o; }

  /* Returns null when `me` may challenge `target`, otherwise the reason in plain words. */
  function whyNot(meP, target, d) {
    var mi = indexOf(meP.id), ti = indexOf(target.id);
    if (d.byeNow.has(meP.id)) return "You requested a bye this round.";
    if (ti >= mi || (mi - ti > maxJump() && !isNewPlayer(meP.id))) return "Out of reach.";
    if (playedInARow(meP.id, target.id)) return "Played last, can't repeat";
    var dupe = d.pending.some(function (c) { return c.challengerId === meP.id && c.targetId === target.id; });
    if (dupe) return "Already challenged";
    return null;
  }

  /* ---------- feedback ---------- */
  function toast(text, isErr) {
    var t = document.getElementById("toast");
    t.textContent = text;
    t.className = isErr ? "err" : "";
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, isErr ? 7000 : 3500);
  }
  function errText(e) {
    var code = e && e.code;
    if (code === "permission-denied") return "That isn't allowed. Reload the page and try again, or ask an organizer.";
    if (code === "unavailable" || code === "resource-exhausted") return "Too busy right now. Try again in a moment.";
    return (e && e.message) || "Something went wrong. Try again.";
  }
  async function act(fn, okMsg) {
    if (busy) return;
    busy = true; render();
    try { await fn(); if (okMsg) toast(okMsg); }
    catch (e) { toast(errText(e), true); }
    finally { busy = false; confirmKey = null; render(); }
  }
  function ask(key) { confirmKey = key; render(); }

  /* ---------- actions ---------- */
  function sendChallenge(targetId) {
    act(async function () {
      var d = derive();
      var meP = players()[indexOf(meId)], t = players()[indexOf(targetId)];
      if (!meP || !t) throw new Error("That player is no longer on the ladder.");
      var why = whyNot(meP, t, d);
      if (why) throw new Error(t.name + " can't be challenged right now. " + why);
      await db.collection("challenges").add({
        challengerId: meP.id, challengerName: meP.name, challengerRank: indexOf(meP.id) + 1,
        targetId: t.id, targetName: t.name, targetRank: indexOf(t.id) + 1,
        round: round(), uid: myUid(), status: "pending", at: Date.now()
      });
    }, "Challenge sent.");
  }
  function ordinal(n) { return n === 1 ? "1st" : n === 2 ? "2nd" : n === 3 ? "3rd" : n + "th"; }
  function prefList(challengerId, d) {
    return d.pending.filter(function (c) { return c.challengerId === challengerId; })
      .sort(function (a, b) { return (a.pref != null ? a.pref : 1e9) - (b.pref != null ? b.pref : 1e9) || (a.at || 0) - (b.at || 0); });
  }
  /* k = 0 removes the challenge; k >= 1 puts the target at that place in the player's ordered choices. */
  function setPreference(targetId, k) {
    act(async function () {
      var d = derive();
      var meP = players()[indexOf(meId)], t = players()[indexOf(targetId)];
      if (!meP || !t) throw new Error("That player is no longer on the ladder.");
      var mine = prefList(meId, d);
      var cur = mine.find(function (c) { return c.targetId === targetId; });
      if (!cur && k > 0) { var why = whyNot(meP, t, d); if (why) throw new Error(t.name + " can't be challenged right now. " + why); }
      var order = mine.filter(function (c) { return c.targetId !== targetId; });
      if (cur && k === 0) await db.doc("challenges/" + cur.id).delete();
      if (k > 0) order.splice(Math.min(k - 1, order.length), 0, cur || { fresh: true, targetId: targetId });
      for (var i = 0; i < order.length; i++) {
        var item = order[i], want = i + 1;
        if (item.fresh) {
          await db.collection("challenges").add({
            challengerId: meP.id, challengerName: meP.name, challengerRank: indexOf(meP.id) + 1,
            targetId: t.id, targetName: t.name, targetRank: indexOf(t.id) + 1,
            round: round(), uid: myUid(), status: "pending", pref: want, at: Date.now()
          });
        } else if (item.pref !== want) {
          await db.doc("challenges/" + item.id).update({ pref: want });
        }
      }
    }, k === 0 ? "Challenge removed." : "Saved as your " + ordinal(k) + " choice.");
  }
  function withdraw(c) {
    act(function () { return db.doc("challenges/" + c.id).delete(); }, "Challenge withdrawn.");
  }
  function takeBye() {
    act(async function () {
      if (derive().byeNow.has(meId)) throw new Error("You already requested a bye this round.");
      await db.collection("moves").add({ type: "bye", uid: myUid(), playerId: meId, round: round(), at: Date.now() });
    }, "Bye requested. The organizer can see it.");
  }
  function cancelBye() {
    act(async function () {
      var id = derive().byeNow.get(meId);
      if (id) await db.doc("moves/" + id).delete();
    }, "Bye request cancelled.");
  }
  function restoreImmunity() {
    act(async function () {
      var mine = moves.filter(function (m) { return m.type === "revoke" && m.playerId === meId; });
      for (var i = 0; i < mine.length; i++) await db.doc("moves/" + mine[i].id).delete();
    }, "Immunity restored.");
  }
  function revokeImmunity() {
    act(function () { return db.collection("moves").add({ type: "revoke", uid: myUid(), playerId: meId, at: Date.now() }); }, "Immunity revoked.");
  }

  /* organizer */
  /* pairings */
  var IMMUNE_WEIGHT = 1.5; // an immune player's challenge ranks this many spots higher
  function nameOfId(id) { var p = players()[indexOf(id)]; return p ? p.name : "Unknown player"; }
  function pairKey(a, b) { return a < b ? a + "|" + b : b + "|" + a; }
  function recentPairs() {
    var r = round(), map = new Map();
    pairingsDocs.forEach(function (doc) {
      if (doc.round < r && doc.round >= r - 3) (doc.pairs || []).forEach(function (p) {
        var k = pairKey(p.a, p.b);
        if (!map.has(k) || doc.round > map.get(k)) map.set(k, doc.round);
      });
    });
    return map;
  }
  /* Two players can't meet twice running: blocked while each one's most recent game was against the other. */
  function lastOpponents() {
    var m = {}, r = round();
    pairingsDocs.filter(function (x) { return x.round < r; }).sort(function (a, b) { return a.round - b.round; })
      .forEach(function (doc) { (doc.pairs || []).forEach(function (p) { m[p.a] = p.b; m[p.b] = p.a; }); });
    return m;
  }
  function playedInARow(x, y) { var m = lastOpponents(); return m[x] === y && m[y] === x; }
  function computePairings(d) {
    var ps = players(), maxJ = maxJump(), hist = recentPairs();
    var last = lastOpponents();
    var blockedPair = function (x, y) { return last[x] === y && last[y] === x; };
    var pos = {};
    ps.forEach(function (p, i) { pos[p.id] = i; });
    var immune = function (id) { return isImmune(ps[pos[id]], d); };
    var onBye = function (id) { return d.byeNow.has(id); };
    var taken = new Set(), pairs = [], unpaired = [];
    var wants = new Map();
    d.pending.slice().sort(function (a, b) {
      return (a.pref != null ? a.pref : 1e9) - (b.pref != null ? b.pref : 1e9) || (a.at || 0) - (b.at || 0);
    }).forEach(function (c) {
      if (pos[c.challengerId] == null || pos[c.targetId] == null) return;
      if (!wants.has(c.challengerId)) wants.set(c.challengerId, []);
      var l = wants.get(c.challengerId);
      if (l.indexOf(c.targetId) < 0) l.push(c.targetId);
    });
    var order = Array.from(wants.keys()).filter(function (id) { return !onBye(id); });
    order.sort(function (a, b) {
      var ea = pos[a] - (immune(a) ? IMMUNE_WEIGHT : 0), eb = pos[b] - (immune(b) ? IMMUNE_WEIGHT : 0);
      return ea - eb || pos[a] - pos[b];
    });
    order.forEach(function (c, i) {
      if (taken.has(c)) return;
      var later = order.slice(i + 1).filter(function (x) { return !taken.has(x); });
      var contest = function (t) { return later.filter(function (x) { return wants.get(x).indexOf(t) >= 0; }).length; };
      var reach = function (t) { return pos[t] < pos[c] && (pos[c] - pos[t] <= maxJ || isNewPlayer(c)); };
      var free = function (t) { return !taken.has(t) && !onBye(t) && !immune(t); };
      var rep = function (t) { return hist.has(pairKey(c, t)); };
      var why = [], ticked = [];
      wants.get(c).forEach(function (t) {
        var nm = ps[pos[t]].name;
        if (!reach(t)) why.push(nm + " is out of reach");
        else if (blockedPair(c, t)) why.push("your last game was against " + nm);
        else if (immune(t)) why.push(nm + " is immune");
        else if (onBye(t)) why.push(nm + " is on a bye");
        else if (taken.has(t)) why.push(nm + " is already paired");
        else ticked.push(t);
      });
      var pool = [];
      for (var j = isNewPlayer(c) ? 0 : Math.max(0, pos[c] - maxJ); j < pos[c]; j++) {
        var id = ps[j].id;

      }

    [["round", "Round " + round()], ["byes", "Bye requests, round " + round()], ["pairings", "Pairings, round " + round()],
     ["past", "Past rounds"], ["sheet", "Google Sheet"], ["rules", "Rules"], ["organizers", "Organizers"]].forEach(function (x) {
      if (secs[x[0]]) parts.push(osec(x[0], x[1], secs[x[0]]));
    });
    return h("section", { class: "panel", "aria-label": "Organizer tools" }, parts);
  }

  function render() {
    if (editing) { dirty = true; return; }
    dirty = false;
    var d = derive();
    var kids = [masthead()];
    if (!dbMissing) kids.push(accountBar());

    if (dbMissing) {
      kids.push(h("section", { class: "panel empty" }, h("h2", { text: "Setup needed" }),
        h("p", { class: "muted", text: "Fill in config.js with your Firebase project and Google API key. The README has the steps." })));
    } else if (loadError) {
      kids.push(h("section", { class: "panel empty" }, h("h2", { text: "The ladder can't be loaded" }),
        h("p", { class: "muted", text: "Check your connection. If this keeps happening, the organizer should check the Firebase setup and security rules." })));
    } else if (!ready.ladder) {
      kids.push(h("section", { class: "panel empty" }, h("h2", { text: "Loading the ladder" }),
        h("p", { class: "muted", text: slow ? "This is taking longer than usual. The ladder may be out of date until the connection recovers." : "One moment." })));
    } else if (!ladder) {
      kids.push(h("section", { class: "panel empty" }, h("h2", { text: "No ladder yet" }),
        h("p", { class: "muted", text: isAdmin ? "Sync from your Google Sheet below to start the ladder." : "The organizer hasn't loaded the ladder yet. Check back soon." })));
    } else {
      kids.push(mePanel(d), ladderList(d));
    }
    if (isAdmin && !dbMissing && !loadError && ready.ladder) kids.push(organizer(d));
    appEl.replaceChildren.apply(appEl, kids);
  }

  appEl.addEventListener("focusin", function (e) { if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName) && e.target.type !== "checkbox") editing = true; });
  appEl.addEventListener("focusout", function () { editing = false; if (dirty) setTimeout(render, 0); });

  /* ---------- sign-in, sheet, downloads ---------- */
  function myUid() { return auth && auth.currentUser ? auth.currentUser.uid : null; }
  function myEmail() { return me && me.email ? me.email.toLowerCase() : ""; }
  function signIn() {
    auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function (e) {
      if (e && e.code === "auth/popup-closed-by-user") return;
      toast(e && e.code === "auth/unauthorized-domain" ? "Add this site's address under Authentication, Settings, Authorized domains in Firebase." : ((e && e.message) || "Sign-in failed."), true);
    });
  }
  function accountBar() {
    if (!auth) return h("div", { class: "acct" });
    if (me && !me.isAnonymous) {
      return h("div", { class: "acct" }, h("span", { class: "muted", text: "Signed in as " + (me.displayName || me.email) + (isAdmin ? (isOwner ? " (owner)" : " (organizer)") : " (not an organizer)") }),
        h("button", { class: "link", onclick: function () { auth.signOut(); } }, "Sign out"));
    }
    return h("div", { class: "acct" }, h("button", { class: "link", onclick: signIn }, "Organizer sign-in"));
  }
  function sheetsShim() {
    var base = "https://sheets.googleapis.com/v4/spreadsheets/";
    async function call(url) {
      var r;
      try { r = await fetch(url); } catch (e) { throw new Error("Couldn't reach Google Sheets. Check your connection."); }
      var j = null;
      try { j = await r.json(); } catch (e) {}
      if (!r.ok) {
        var st = r.status;
        throw new Error(st === 403 ? "Google wouldn't let this page read the sheet. Share it as \"Anyone with the link can view\", and check that the API key allows this site."
          : st === 404 ? "That sheet wasn't found. Check the link."
          : st === 400 ? "Google couldn't read that range. Check the tab name."
          : "Google Sheets returned an error (" + st + ").");
      }
      return j || {};
    }
    return { callTool: async function (server, tool, args) {
      if (!SHEET.id) throw new Error("Choose a Google Sheet first.");
      if (!CFG.sheetsApiKey || /YOUR_/.test(CFG.sheetsApiKey)) throw new Error("Add your Google API key to config.js first.");
      var key = encodeURIComponent(CFG.sheetsApiKey);
      if (tool === "get_spreadsheet") return { payload: await call(base + SHEET.id + "?fields=sheets.properties.title&key=" + key) };
      var j = await call(base + SHEET.id + "/values/" + encodeURIComponent(args.range) + "?key=" + key);
      if (!j.values) j.values = [];
      return { payload: j };
    } };
  }
  function downloadShim() {
    return { save: function (o) {
      var blob = new Blob([o.data], { type: "text/csv;charset=utf-8" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = o.filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
      return Promise.resolve();
    } };
  }
  function saveSheetSettings() {
    var sd = sheetDraft || { url: SHEET.id ? "https://docs.google.com/spreadsheets/d/" + SHEET.id : "", tab: (sheetCfg && sheetCfg.ladderTab) || "LADDER" };
    var m = /\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/.exec(sd.url) || /^([a-zA-Z0-9_-]{20,})$/.exec(sd.url);
    var tab = (sd.tab || "").trim();
    if (!m) { toast("Paste the full Google Sheet link.", true); return; }
    if (!tab) { toast("Enter the name of the ladder tab.", true); return; }
    act(async function () { await db.doc("settings/sheet").set({ sheetId: m[1], ladderTab: tab, savedAt: Date.now() }); sheetDraft = null; }, "Sheet saved.");
  }
  function organizersPanel() {
    var rows = admins.slice().sort(function (a, b) { return a.id < b.id ? -1 : 1; }).map(function (a) {
      return h("li", {}, h("div", { class: "vs" }, h("b", { text: a.id }), h("div", { class: "meta", text: a.role === "owner" ? "Owner" : "Organizer" })),
        (isOwner && a.id !== myEmail()) ? h("button", { class: "link", disabled: busy, onclick: function () { removeAdmin(a.id); } }, "Remove") : null);
    });
    return h("div", { style: "display:flex;flex-direction:column;gap:10px" },
      h("p", { class: "small muted", text: "Organizers see these tools and can change the ladder. Add the Google email address they sign in with." }),
      rows.length ? h("ul", { class: "feed" }, rows) : null,
      isOwner
        ? [h("label", { class: "field", for: "adm-email" }, "Organizer's Google email", h("input", { id: "adm-email", type: "email", style: "width:100%", value: adminDraft, placeholder: "name@example.com", oninput: function (e) { adminDraft = e.target.value; } })),
           h("div", { class: "row" }, h("button", { class: "ghost", disabled: busy, onclick: addAdmin }, "Add organizer"))]
        : h("p", { class: "small muted", text: "Only an owner can add or remove organizers." }));
  }
  function addAdmin() {
    var em = adminDraft.trim().toLowerCase();
    if (!/^[^\s@\/]+@[^\s@\/]+\.[^\s@\/]+$/.test(em)) { toast("Enter a valid email address.", true); return; }
    act(async function () { await db.doc("admins/" + em).set({ role: "organizer", addedBy: myEmail(), at: Date.now() }); adminDraft = ""; }, "Organizer added.");
  }
  function removeAdmin(em) {
    act(function () { return db.doc("admins/" + em).delete(); }, "Organizer removed.");
  }

  /* ---------- connect ---------- */
  function listen(col, assign) {
    return db.collection(col).onSnapshot(function (snap) {
      assign(snap.docs.map(function (s) { return Object.assign({ id: s.id }, s.data()); }));
      render();
    }, function (e) { loadError = e; render(); });
  }
  var sheetCfg = null;
  async function boot() {
    render();
    var cfg = CFG.firebase;
    if (!window.firebase || !cfg || !cfg.projectId || /YOUR_/.test(JSON.stringify(cfg))) { dbMissing = true; render(); return; }
    firebase.initializeApp(cfg);
    auth = firebase.auth(); db = firebase.firestore();
    mcp = sheetsShim(); downloads = downloadShim();
    var timer = setTimeout(function () { if (!ready.ladder) { slow = true; render(); } }, 10000);
    db.doc("ladder/current").onSnapshot(function (s) {
      ladder = s.exists ? s.data() : null;
      if (!s.metadata.fromCache || s.exists) { ready.ladder = true; clearTimeout(timer); }
      render();
    }, function (e) { loadError = e; clearTimeout(timer); render(); });
    db.doc("settings/sheet").onSnapshot(function (s) {
      sheetCfg = s.exists ? s.data() : null;
      SHEET.id = sheetCfg ? sheetCfg.sheetId : "";
      SHEET.range = sheetCfg ? "'" + String(sheetCfg.ladderTab || "LADDER").replace(/'/g, "''") + "'!A1:E1004" : "";
      SHEET.label = sheetCfg ? "the " + (sheetCfg.ladderTab || "LADDER") + " tab of your sheet" : "your Google Sheet";
      render();
    }, function () {});
    listen("challenges", function (rows) { challenges = rows; });
    listen("moves", function (rows) { moves = rows; });
    listen("pairings", function (rows) { pairingsDocs = rows; });
    auth.onAuthStateChanged(async function (u) {
      isAdmin = false; isOwner = false; admins = [];
      if (adminUnsub) { adminUnsub(); adminUnsub = null; }
      if (!u) {
        me = null; canWrite = false; render();
        auth.signInAnonymously().catch(function (e) {
          toast(e && e.code === "auth/operation-not-allowed" ? "Turn on Anonymous sign-in under Authentication in the Firebase console." : ((e && e.message) || "Couldn't connect."), true);
        });
        return;
      }
      me = u; canWrite = true;
      if (!u.isAnonymous && u.email) {
        try {
          var snap = await db.doc("admins/" + u.email.toLowerCase()).get();
          if (snap.exists) { isAdmin = true; isOwner = snap.data().role === "owner"; }
        } catch (e) {}
      }
      if (isAdmin) adminUnsub = db.collection("admins").onSnapshot(function (sn) { admins = sn.docs.map(function (x) { return Object.assign({ id: x.id }, x.data()); }); render(); }, function () {});
      render();
    });
  }
  boot();
})();
</script>
</body>
</html>
